name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -r requirements-dev.txt -e ".[fast,socks]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m pytest -o addopts='' -q --timeout=60 --cov --cov-report=term-missing:skip-covered --cov-report=xml
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck (instalador Termux)
        run: shellcheck termux-setup.sh
      - name: Sintaxe bash
        run: bash -n termux-setup.sh

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build
      - run: python -m build
      - name: Smoke test wheel
        run: |
          python -m pip install dist/*.whl
          python tools/smoke_wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
