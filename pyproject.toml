[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telecopy"
version = "4.1.0"
description = "Copiador fiel e retomável de canais/grupos/fóruns Telegram"
requires-python = ">=3.10"
dependencies = [
  "telethon==1.45.0",
  "cryptography>=42.0.0",
  "psutil>=5.9.0",
  "rich>=13.7.0",
]

[project.optional-dependencies]
fast = ["cryptg>=0.4.0"]
socks = ["python-socks[asyncio]>=2.4.0"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-timeout>=2.2",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.10",
  "icmplib>=3.0.4",
  "pip-audit>=2.7",
  "mutmut>=2.4,<3",
]

[project.scripts]
telecopy = "telecopy_cli:main"

[tool.setuptools]
py-modules = ["config", "copier", "core", "database", "dedup", "doctor", "fasttransfer",
              "filters", "i18n", "main", "politica_erros", "prefs", "relatorio",
              "retry_queue", "security", "system_analyzer", "telecopy_cli", "utils",
              "verificacao", "channel_clone", "opcional"]

[tool.ruff]
target-version = "py310"
exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401", "F841"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
exclude = ["data/", ".venv/"]

[tool.coverage.run]
source = ["fasttransfer", "database", "dedup", "security", "prefs", "politica_erros", "verificacao", "relatorio", "copier", "core", "opcional", "utils", "telecopy_cli"]
branch = true

[tool.coverage.report]
show_missing = true
